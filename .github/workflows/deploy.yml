name: CI/CD - Test & Deploy Swira

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  test-backend:
    name: Tests Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend-swira/nestjs

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: './backend-swira/nestjs/package-lock.json'

      - name: Instalar dependencias del backend
        run: npm ci

      - name: Ejecutar tests del backend
        run: npm test

  build-frontend:
    name: Test & Build Frontend (React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend-swira

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: './frontend-swira/package-lock.json'

      - name: Instalar dependencias del frontend
        run: npm ci

      - name: Ejecutar tests del frontend
        run: npm test -- --run

      - name: Compilar proyecto (Build)
        run: npm run build
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}

      - name: Subir artefacto para GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend-swira/dist'

  deploy:
    name: Desplegar en GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    steps:
      - name: Desplegar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4